<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - BookStore</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <i class="fas fa-book-open"></i>
          <span>BookStore</span>
        </div>
        <div class="nav-menu">
          <a href="index.html" class="nav-link">Home</a>
          <a href="cart.html" class="nav-link active">Cart</a>
          <a href="checkout.html" class="nav-link">Checkout</a>
        </div>
        <div class="nav-actions">
          <a href="cart.html" class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Cart Content -->
  <main class="cart-page">
    <div class="container">
      <h1 class="page-title">Shopping Cart</h1>

      <div class="cart-container">
        <div class="cart-items" id="cartItems">
          <!-- Cart items will be loaded here -->
        </div>

        <div class="cart-summary">
          <h2>Order Summary</h2>
          <div class="summary-item">
            <span>Subtotal:</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-item">
            <span>Shipping:</span>
            <span id="shipping">$5.00</span>
          </div>
          <div class="summary-item">
            <span>Tax (10%):</span>
            <span id="tax">$0.00</span>
          </div>
          <div class="summary-item total">
            <span>Total:</span>
            <span id="total">$0.00</span>
          </div>
          <button class="checkout-btn" onclick="proceedToCheckout()">
            Proceed to Checkout <i class="fas fa-arrow-right"></i>
          </button>
          <button class="continue-shopping-btn" onclick="window.location.href='index.html'">
            Continue Shopping
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h3>BookStore</h3>
          <p>Your trusted source for quality books since 2024</p>
        </div>
        <div class="footer-section">
          <h4>Quick Links</h4>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="checkout.html">Checkout</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 BookStore. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Cart updated!</span>
  </div>

  <script src="app.js"></script>
</body>

</html>
